:root{
  --kagit:#EDEBE6; --murekkep:#33312C; --soluk:#7C776C;
  --cizgi:#CFCBC1; --vurgu:#2F4033;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--kagit);color:var(--murekkep);font-family:'JO',sans-serif;
     -webkit-font-smoothing:antialiased;padding:0 20px 80px}
.sayfa{max-width:860px;margin:0 auto}

/* ---------- KIRINTI ---------- */
.kirinti{margin-top:40px;font:400 12px/1 'JO';letter-spacing:.14em;text-transform:uppercase;color:var(--soluk)}
.kirinti a{color:var(--soluk);text-decoration:none;border-bottom:1px solid var(--cizgi);transition:.18s}
.kirinti a:hover{color:var(--vurgu);border-color:var(--vurgu)}
.kirinti span{opacity:.5;margin:0 6px}

/* ---------- BASLIK ---------- */
header{padding:56px 0 30px;position:relative}
.seri{font:500 13px/1 'JO';letter-spacing:.34em;text-transform:uppercase;color:var(--soluk)}
h1{font:700 62px/1.02 'PF';margin:22px 0 10px;letter-spacing:-.01em}
.alt{font:400 italic 22px/1.4 'PF';color:var(--soluk)}
.hafta{position:absolute;right:0;top:56px;font:400 italic 30px/1 'PF';color:var(--vurgu)}

/* ---------- TARIF LEJANDI ---------- */
.lejant{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
        gap:10px 26px;margin:34px 0 10px;padding:22px 0;
        border-top:1px solid var(--cizgi);border-bottom:1px solid var(--cizgi)}
.lej{display:flex;gap:10px;align-items:baseline}
.lej b{font:400 italic 19px/1 'PF';color:var(--vurgu);min-width:22px}
.lej span{font:400 14px/1.35 'JO';letter-spacing:.04em}

/* ---------- ILERLEME ---------- */
.bar{display:flex;align-items:center;gap:18px;margin:26px 0 6px;flex-wrap:wrap}
.sayac{font:400 14px/1 'JO';letter-spacing:.18em;text-transform:uppercase;color:var(--soluk);white-space:nowrap}
.sayac b{color:var(--vurgu);font-weight:500}
.hat{flex:1;height:2px;background:var(--cizgi);min-width:120px;position:relative;overflow:hidden}
.hat i{position:absolute;inset:0 auto 0 0;width:0;background:var(--vurgu);transition:width .3s ease}
.dugmeler{display:flex;gap:8px}
button{font:400 12px/1 'JO';letter-spacing:.16em;text-transform:uppercase;
       background:none;border:1px solid var(--cizgi);color:var(--soluk);
       padding:10px 16px;cursor:pointer;border-radius:2px;transition:.18s}
button:hover{border-color:var(--vurgu);color:var(--vurgu)}

/* ---------- BOLUMLER ---------- */
.bolumler{margin-top:44px}
section{margin-bottom:44px;break-inside:avoid}
.bh{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
.bh h2{font:500 13px/1 'JO';letter-spacing:.3em;text-transform:uppercase;color:var(--vurgu)}
.bh em{font:400 italic 15px/1 'PF';color:var(--soluk)}
.bh .r{flex:1;height:1px;background:var(--cizgi)}

ul{list-style:none}
li{display:flex;align-items:flex-start;gap:14px;padding:11px 0;
   border-bottom:1px solid rgba(207,203,193,.5);cursor:pointer;
   transition:opacity .2s ease;-webkit-tap-highlight-color:transparent}
li:last-child{border-bottom:none}
.kutu{flex:none;width:17px;height:17px;border:1.5px solid var(--soluk);
      border-radius:2px;margin-top:2px;position:relative;transition:.18s}
.kutu:after{content:"";position:absolute;left:4.5px;top:.5px;width:5px;height:10px;
      border:solid var(--kagit);border-width:0 1.7px 1.7px 0;transform:rotate(45deg) scale(0);
      transition:transform .18s ease}
.ad{flex:1;font:400 17px/1.3 'JO';letter-spacing:.01em}
.ad small{display:block;font:300 13px/1.3 'JO';color:var(--soluk);margin-top:2px}
.olcu{font:400 15px/1.3 'JO';color:var(--soluk);white-space:nowrap;text-align:right}
.no{flex:none;font:400 italic 14px/1.3 'PF';color:var(--vurgu);opacity:.65;
    min-width:46px;text-align:right}
.ops{font:400 11px/1 'JO';letter-spacing:.14em;text-transform:uppercase;
     color:var(--soluk);border:1px solid var(--cizgi);padding:3px 6px;border-radius:2px;margin-left:8px}

li.ok .ad,li.ok .olcu,li.ok .no,li.ok .ops{opacity:.4}
li.ok .kutu{background:var(--vurgu);border-color:var(--vurgu)}
li.ok .kutu:after{transform:rotate(45deg) scale(1)}
li.ok .ad{text-decoration:line-through;text-decoration-thickness:1px}

/* ---------- ALT ---------- */
footer{margin-top:56px;padding-top:26px;border-top:1px solid var(--cizgi);
        display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
        font:400 12px/1.6 'JO';letter-spacing:.2em;text-transform:uppercase;color:var(--soluk)}

/* ---------- MOBIL ---------- */
@media (max-width:620px){
  header{padding-top:40px}
  h1{font-size:44px}
  .hafta{top:40px;font-size:24px}
  .olcu{font-size:14px}
  .no{min-width:38px;font-size:13px}
  li{padding:13px 0}
}

/* ---------- BASKI ---------- */
@page{size:A4;margin:13mm}
@media print{
  .kirinti{display:none}
  body{background:#fff;padding:0;font-size:11px}
  .sayfa{max-width:none}
  header{padding:0 0 14px}
  h1{font-size:34px;margin:10px 0 6px}
  .alt{font-size:14px}
  .seri{font-size:9px}
  .hafta{top:0;font-size:18px}
  .lejant{margin:16px 0 0;padding:12px 0;gap:4px 18px}
  .lej span{font-size:10px}
  .lej b{font-size:13px}
  .bar{display:none}
  .bolumler{margin-top:16px;column-count:2;column-gap:26px}
  section{margin-bottom:16px}
  .bh h2{font-size:9px}
  li{padding:5px 0}
  li.ok .ad,li.ok .olcu,li.ok .no,li.ok .ops{opacity:1}
  li.ok .ad{text-decoration:none}
  li.ok .kutu{background:none;border-color:#000}
  li.ok .kutu:after{display:none}
  .kutu{width:12px;height:12px;border-color:#555}
  .ad{font-size:11px}.ad small{font-size:9px}
  .olcu{font-size:10px}.no{font-size:10px;min-width:34px}
  .ops{font-size:8px;padding:1px 4px}
  footer{margin-top:14px;padding-top:8px;font-size:9px}
}
</style>

/* ---------- KURULUM ---------- */
document.getElementById('hafta').textContent = HAFTA.no;
document.getElementById('baslik').textContent = HAFTA.baslik;
document.getElementById('altbaslik').textContent = HAFTA.altBaslik;

document.getElementById('lejant').innerHTML = HAFTA.tarifler.map((t,i)=>
  `<div class="lej"><b>${String(i+1).padStart(2,'0')}</b><span>${t}</span></div>`).join('');

document.getElementById('bolumler').innerHTML = HAFTA.bolumler.map(b=>`
  <section>
    <div class="bh"><h2>${b.ad}</h2>${b.not?`<em>${b.not}</em>`:''}<div class="r"></div></div>
    <ul>${b.urunler.map(u=>`
      <li onclick="this.classList.toggle('ok');say()">
        <span class="kutu"></span>
        <span class="ad">${u.i}${u.ops?'<span class="ops">isteğe bağlı</span>':''}
          ${u.not?`<small>${u.not}</small>`:''}</span>
        <span class="olcu">${u.o}</span>
        <span class="no">${u.t.map(n=>String(n).padStart(2,'0')).join(' ')}</span>
      </li>`).join('')}</ul>
  </section>`).join('');

/* ---------- SAYAC ---------- */
const hepsi = document.querySelectorAll('li');
document.getElementById('toplam').textContent = hepsi.length;
function say(){
  const n = document.querySelectorAll('li.ok').length;
  document.getElementById('alinan').textContent = n;
  document.getElementById('dolgu').style.width = (n/hepsi.length*100)+'%';
}
function temizle(){ hepsi.forEach(l=>l.classList.remove('ok')); say(); }
say();
</script>
