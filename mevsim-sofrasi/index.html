<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mevsim Sofrası | Hande Akıner</title>
    <meta name="description" content="Hande Akıner'in haftalık Mevsim Sofrası tariflerine ait pazar listeleri.">

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VBZF5ME1W7"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-VBZF5ME1W7');
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FDF8F3;
            --soft-peach: #F5E6D8;
            --warm-blush: #E8D4C4;
            --terracotta: #C4A484;
            --gold: #B8956C;
            --deep-brown: #5C4A3D;
            --text-dark: #3D3229;
            --text-light: #7A6B5E;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Jost', sans-serif;
            background-color: var(--cream);
            color: var(--text-dark);
            line-height: 1.7;
            font-weight: 300;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Navigation */
        nav {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--deep-brown);
            letter-spacing: 0.05em;
            text-decoration: none;
        }

        .nav-back {
            text-decoration: none;
            color: var(--text-light);
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .nav-back:hover { color: var(--gold); }

        /* Hero */
        .hero {
            padding: 4rem 0 3rem;
            text-align: center;
        }

        .hero-subtitle {
            font-size: 0.8rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 1.5rem;
        }

        .hero-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 400;
            color: var(--deep-brown);
            line-height: 1.1;
            margin-bottom: 1.25rem;
        }

        .hero-description {
            font-size: 1.05rem;
            color: var(--text-light);
            max-width: 480px;
            margin: 0 auto;
        }

        /* Weeks grid */
        .haftalar {
            padding: 1rem 0 8rem;
        }

        .haftalar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .hafta-card {
            display: block;
            background: var(--cream);
            border-radius: 20px;
            padding: 2rem;
            text-decoration: none;
            color: var(--text-dark);
            box-shadow: 0 4px 20px rgba(92, 74, 61, 0.08);
            border-top: 3px solid var(--deep-brown);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .hafta-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(92, 74, 61, 0.15);
        }

        .hafta-etiket {
            display: inline-block;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 0.75rem;
        }

        .hafta-baslik {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            color: var(--deep-brown);
            margin-bottom: 0.4rem;
        }

        .hafta-alt {
            font-size: 0.85rem;
            font-style: italic;
            color: var(--text-light);
            margin-bottom: 1.25rem;
        }

        .hafta-tarifler {
            list-style: none;
            margin-bottom: 1.5rem;
        }

        .hafta-tarifler li {
            font-size: 0.85rem;
            color: var(--text-dark);
            padding: 0.35rem 0;
            border-bottom: 1px solid var(--warm-blush);
        }

        .hafta-tarifler li:last-child { border-bottom: none; }

        .hafta-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--gold);
            font-size: 0.85rem;
            font-weight: 500;
            transition: gap 0.3s ease;
        }

        .hafta-card:hover .hafta-link { gap: 0.75rem; }

        .hafta-link svg {
            width: 16px;
            height: 16px;
        }

        .durum {
            text-align: center;
            padding: 3rem;
            color: var(--text-light);
            font-size: 0.9rem;
            display: none;
        }

        .durum.active { display: block; }

        /* Footer */
        footer {
            padding: 3rem 2rem;
            text-align: center;
            background: var(--deep-brown);
            color: var(--soft-peach);
        }

        .footer-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25rem;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
        }

        .footer-text {
            font-size: 0.75rem;
            opacity: 0.6;
            letter-spacing: 0.1em;
        }

        @media (max-width: 600px) {
            .haftalar-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="../" class="logo">Hande Akıner</a>
        <a href="../" class="nav-back">← Ana Sayfa</a>
    </nav>

    <section class="hero">
        <div class="container">
            <p class="hero-subtitle">Haftalık Pazar Listeleri</p>
            <h1 class="hero-title">Mevsim Sofrası</h1>
            <p class="hero-description">Her hafta paylaştığım beş tarif için ölçüleriyle eksiksiz market listesi. Bir haftayı seçin, listeyi işaretleyin ya da yazdırın.</p>
        </div>
    </section>

    <section class="haftalar">
        <div class="container">
            <div class="haftalar-grid" id="haftalarGrid"></div>
            <p class="durum" id="durum">Listeler yükleniyor...</p>
        </div>
    </section>

    <footer>
        <div class="footer-logo">Hande Akıner</div>
        <p class="footer-text">© 2025 Tüm Hakları Saklıdır</p>
    </footer>

    <script>
        // ============================================================
        //  HAFTA NUMARALARI — yeni bir hafta eklerken buraya en başa
        //  yeni numarayı ekleyin (en yeni hafta en solda/üstte görünür).
        //  Örn. yeni hafta 10 eklendiğinde: const HAFTALAR = ["10", "09"];
        // ============================================================
        const HAFTALAR = ["09"];

        const arrowIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';

        function haftaKartOlustur(no, hafta) {
            const tarifler = (hafta.tarifler || []).map(t => `<li>${t}</li>`).join('');
            return `
                <a class="hafta-card" href="${no}/" onclick="gtag('event', 'mevsim_hafta_click', {hafta_no: '${no}'});">
                    <span class="hafta-etiket">Hafta ${no}</span>
                    <h3 class="hafta-baslik">${hafta.baslik || 'Pazar Listesi'}</h3>
                    <p class="hafta-alt">${hafta.altBaslik || ''}</p>
                    <ul class="hafta-tarifler">${tarifler}</ul>
                    <span class="hafta-link">Listeyi Aç ${arrowIcon}</span>
                </a>`;
        }

        // Her haftanın kendi index.html'i içindeki "const HAFTA = {...}" verisini
        // ayrıca kopyalamaya gerek kalmadan burada okuyup kart olarak gösteriyoruz.
        async function haftaViOku(no) {
            const res = await fetch(`${no}/index.html`);
            if (!res.ok) throw new Error(`${no} bulunamadı`);
            const html = await res.text();
            const match = html.match(/const HAFTA = (\{[\s\S]*?\n\};)/);
            if (!match) throw new Error(`${no} verisi okunamadı`);
            const HAFTA = new Function(`${match[0]} return HAFTA;`)();
            return HAFTA;
        }

        async function haftalariYukle() {
            const grid = document.getElementById('haftalarGrid');
            const durum = document.getElementById('durum');
            durum.classList.add('active');

            const sonuclar = await Promise.allSettled(HAFTALAR.map(no => haftaViOku(no)));

            const kartlar = sonuclar
                .map((sonuc, i) => sonuc.status === 'fulfilled' ? haftaKartOlustur(HAFTALAR[i], sonuc.value) : null)
                .filter(Boolean);

            durum.classList.remove('active');

            if (kartlar.length > 0) {
                grid.innerHTML = kartlar.join('');
            } else {
                durum.textContent = 'Henüz yayınlanmış bir liste yok.';
                durum.classList.add('active');
            }
        }

        haftalariYukle();
    </script>
</body>
</html>
