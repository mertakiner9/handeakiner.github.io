:root{
  --kagit:#FAF8F3; --murekkep:#29251F; --koyu:#1F1B16;
  --soluk:#9A9286; --orta:#6B6459; --cizgi:#E0DBD1; --kutu:#C8C2B8;
  --vurgu:#B4552C;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--kagit);color:var(--murekkep);
     font-family:'Jost',-apple-system,'Helvetica Neue',sans-serif;
     -webkit-font-smoothing:antialiased;padding:0 22px 90px}
.sayfa{max-width:880px;margin:0 auto}

/* ---------- kırıntı ---------- */
.kirinti{margin-top:40px;font:400 12px/1 'Jost';letter-spacing:.14em;text-transform:uppercase;color:var(--soluk)}
.kirinti a{color:var(--soluk);text-decoration:none;border-bottom:1px solid var(--cizgi);transition:.18s}
.kirinti a:hover{color:var(--vurgu);border-color:var(--vurgu)}
.kirinti span{opacity:.5;margin:0 6px}
@media print{.kirinti{display:none}}

/* ---------- başlık ---------- */
header{padding:58px 0 0}
.seri{font:400 13px/1 'Jost';letter-spacing:.32em;text-transform:uppercase;color:var(--soluk)}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:68px;line-height:1;
   letter-spacing:-.005em;color:var(--koyu);margin:16px 0 10px}
.ust{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.alt{font-family:'EB Garamond',Georgia,serif;font-style:italic;font-size:21px;color:var(--orta)}
.hesap{font:400 13px/1 'Jost';color:#B5AE9F;white-space:nowrap}

/* ---------- tarif lejantı ---------- */
.lejant{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 26px;
        margin:30px 0 0;padding:22px 0;border-top:1px solid var(--cizgi);border-bottom:1px solid var(--cizgi)}
.lej{display:flex;gap:11px;align-items:baseline}
.lej b{font:500 13px/1 'Jost';color:var(--vurgu);min-width:20px}
.lej span{font-family:'EB Garamond',Georgia,serif;font-size:19px;line-height:1.25;color:var(--murekkep)}

/* ---------- ilerleme ---------- */
.bar{display:flex;align-items:center;gap:18px;margin:26px 0 4px;flex-wrap:wrap}
.sayac{font:400 13px/1 'Jost';letter-spacing:.18em;text-transform:uppercase;color:var(--soluk);white-space:nowrap}
.sayac b{color:var(--vurgu);font-weight:500}
.hat{flex:1;height:2px;background:var(--cizgi);min-width:110px;position:relative;overflow:hidden}
.hat i{position:absolute;inset:0 auto 0 0;width:0;background:var(--vurgu);transition:width .3s ease}
.dugmeler{display:flex;gap:8px}
button{font:400 12px/1 'Jost';letter-spacing:.16em;text-transform:uppercase;background:none;
  border:1px solid var(--cizgi);color:var(--soluk);padding:10px 15px;border-radius:2px;
  cursor:pointer;transition:.18s}
button:hover{border-color:var(--vurgu);color:var(--vurgu)}

/* ---------- bölümler ---------- */
.bolumler{margin-top:42px}
section{margin-bottom:40px;break-inside:avoid}
.bh{display:flex;align-items:baseline;gap:13px;margin-bottom:8px}
.bh h2{font:400 13px/1 'Jost';letter-spacing:.22em;text-transform:uppercase;color:var(--soluk);white-space:nowrap}
.bh i{flex:1;height:1px;background:var(--cizgi)}
ul{list-style:none}
li{display:flex;align-items:flex-start;gap:14px;padding:13px 0;
   border-bottom:1px solid rgba(224,219,209,.65);cursor:pointer;
   -webkit-tap-highlight-color:transparent}
li:last-child{border-bottom:none}
.kt{flex:none;width:15px;height:15px;border:1px solid var(--kutu);margin-top:7px;position:relative;transition:.18s}
.kt:after{content:"";position:absolute;left:4px;top:0;width:5px;height:10px;
  border:solid var(--kagit);border-width:0 1.6px 1.6px 0;transform:rotate(45deg) scale(0);
  transition:transform .18s ease}
.ad{flex:1;font-family:'EB Garamond',Georgia,serif;font-size:27px;line-height:1.15;color:var(--murekkep)}
.ad small{display:block;font-family:'Jost',sans-serif;font-size:13px;line-height:1.35;
  color:var(--soluk);margin-top:3px}
.ol{font:400 13px/1.3 'Jost';color:var(--soluk);white-space:nowrap;text-align:right;margin-top:9px}
.no{flex:none;font:400 12px/1.3 'Jost';color:var(--vurgu);opacity:.75;letter-spacing:.06em;
  min-width:52px;text-align:right;margin-top:9px}
li.ok .kt{background:var(--kutu);border-color:var(--kutu)}
li.ok .kt:after{transform:rotate(45deg) scale(1)}
li.ok .ad,li.ok .ol,li.ok .no{opacity:.4}
li.ok .ad{text-decoration:line-through;text-decoration-thickness:1px}

/* ---------- alt ---------- */
footer{margin-top:50px;padding-top:26px;border-top:1px solid var(--cizgi);text-align:center}
.dipnot{font-family:'EB Garamond',Georgia,serif;font-style:italic;font-size:19px;color:var(--soluk)}
.adres{font:400 12px/1 'Jost';letter-spacing:.14em;color:#B5AE9F;margin-top:16px}

/* ---------- mobil ---------- */
@media (max-width:620px){
  header{padding-top:38px}
  h1{font-size:48px}
  .ad{font-size:24px}
  li{padding:14px 0}
  .no{min-width:46px}
}

/* ---------- baskı ---------- */
@page{size:A4;margin:13mm}
@media print{
  body{background:#fff;padding:0}
  .sayfa{max-width:none}
  header{padding:0}
  h1{font-size:38px;margin:8px 0 6px}
  .alt{font-size:15px}
  .seri{font-size:9px}
  .lejant{margin:14px 0 0;padding:11px 0;gap:5px 18px}
  .lej span{font-size:13px}.lej b{font-size:10px}
  .bar{display:none}
  .bolumler{margin-top:16px;column-count:2;column-gap:26px}
  section{margin-bottom:16px}
  .bh h2{font-size:9px}
  li{padding:5px 0}
  li.ok .ad{text-decoration:none}
  li.ok .kt{background:none;border-color:#000}
  li.ok .kt:after{display:none}
  li.ok .ad,li.ok .ol,li.ok .no{opacity:1}
  .kt{width:11px;height:11px;margin-top:4px}
  .ad{font-size:15px}.ad small{font-size:9px}
  .ol{font-size:10px;margin-top:4px}.no{font-size:9px;min-width:40px;margin-top:4px}
  footer{margin-top:14px;padding-top:9px}
  .dipnot{font-size:11px}.adres{font-size:8px;margin-top:7px}
}
</style>

/* ---------- kurulum ---------- */
document.getElementById('baslik').textContent = HAFTA.baslik;
document.getElementById('altbaslik').textContent = HAFTA.altBaslik;
document.getElementById('dipnot').textContent = HAFTA.dipnot;
document.getElementById('adres').textContent = HAFTA.adres;

document.getElementById('lejant').innerHTML = HAFTA.tarifler.map((t,i)=>
  `<div class="lej"><b>${String(i+1).padStart(2,'0')}</b><span>${t}</span></div>`).join('');

document.getElementById('bolumler').innerHTML = HAFTA.bolumler.map(b=>`
  <section>
    <div class="bh"><h2>${b.ad}</h2><i></i></div>
    <ul>${b.urunler.map(u=>`
      <li onclick="isaretle(this)">
        <span class="kt"></span>
        <span class="ad">${u.i}${u.not?`<small>${u.not}</small>`:''}</span>
        <span class="ol">${u.o}</span>
        <span class="no">${u.t.map(n=>String(n).padStart(2,'0')).join(' ')}</span>
      </li>`).join('')}</ul>
  </section>`).join('');

/* ---------- sayaç + hafıza ---------- */
const hepsi = document.querySelectorAll('li');
document.getElementById('toplam').textContent = hepsi.length;
hepsi.forEach((l,i)=> l.dataset.k = i);
const ANAHTAR = 'mevsim-sofrasi-' + HAFTA.no;

function kaydet(){
  try{
    localStorage.setItem(ANAHTAR,
      JSON.stringify([...document.querySelectorAll('li.ok')].map(l=>l.dataset.k)));
  }catch(e){}
}
function yukle(){
  try{
    (JSON.parse(localStorage.getItem(ANAHTAR)||'[]')).forEach(k=>{
      const l=document.querySelector(`li[data-k="${k}"]`); if(l) l.classList.add('ok');
    });
  }catch(e){}
}
function say(){
  const n=document.querySelectorAll('li.ok').length;
  document.getElementById('alinan').textContent=n;
  document.getElementById('dolgu').style.width=(n/hepsi.length*100)+'%';
}
function isaretle(el){ el.classList.toggle('ok'); kaydet(); say(); }
function temizle(){
  hepsi.forEach(l=>l.classList.remove('ok'));
  try{ localStorage.removeItem(ANAHTAR); }catch(e){}
  say();
}
yukle(); say();
</script>
